name: Validate Python tutorials

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  python-tutorials:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate tutorial examples
        run: python scripts/validate_python_tutorials.py
